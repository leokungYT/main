ในขั้นตอนmathรูปภาพ 

เพิ่มเงือนไขให้หน่อย
    "HERO_MAPPING": {
        "gachahero1": "Reno+",
        "gachahero2": "hina+",
        "gachahero3": "KafkaU+",
        "gachahero4": "Kafka+"
    },
    "Hero_low": {
        "enabled": 1,
        "low1": "low1.bmp": name = kikoru+, 
        "low2": "low2.bmp : name = kikoruU+"
    },

ถ้าเราเปิดhero low = 1 ให้มันหาพวกlow1.bmp and low2.bmp ด้วย 
ถ้าmath ไม่ต้องให้มันจบการทำงานนะเจอเฉยๆ แค่ให้มันนับไว้แล้ว แล้วให้มันทำงานตามปกติไปเรื่อยๆจนถึง
เงือนไขออกถ้ามันไม่เจออะไรเลย แต่ถ้ามันเจอ low1 or low2 ให้มันเขียนลงในชื่อไฟล์ด้วย เช่น kikoru+ขื่อเดิม.xml


แต่ถ้ามันเจอ ใน heromaping ให้มันจบการทำงานไปเลยนะไม่ต้องทำงาน hero_low ต่อ 
แล้วส่งไฟล์ออกตามปกติ 


แต่ถ้ามันเจอ low1 หรือ low2 ก่อนแล้วแล้วทำงานไปเรื่อยๆแล้ว้เจอ heromaping ให้มันจบการทำงานแล้ว
ส่งไฟล์ออกมาในรูปแบบนี้ ตัวอย่าง 
kikoru+Kafka+ชื่อเดิม.xml แบบนี้เลย