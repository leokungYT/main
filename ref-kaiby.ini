def do_mission_sequence(device):
    """ฟังก์ชันสำหรับทำภารกิจ"""
    try:
        scroll_count = 0
        max_scrolls = 15  # จำนวนครั้งสูงสุดที่จะเลื่อน
        stop_scrolling = False  # ตัวแปรควบคุมการเลื่อน
        checked_stages = set()  # เพิ่มตัวแปรเก็บ stage ที่เช็คไปแล้ว
        
        while True:
            cap = device.screencap()
            image = np.frombuffer(cap, dtype=np.uint8)
            adb_img = cv2.imdecode(image, cv2.IMREAD_COLOR)
            
            # ตรวจสอบ stageget.png ก่อนเป็นอันดับแรก
            stageget_pos = ImgSearchADB(adb_img, 'img/stageget.png')
            if stageget_pos:
                print(f"พบและกด stageget.png บนอุปกรณ์ {device.serial}")
                device.shell(f"input tap {stageget_pos[0][0]} {stageget_pos[0][1]}")
                time.sleep(1)
                
                # จากนั้นค่อยหา stageok
                cap = device.screencap()
                image = np.frombuffer(cap, dtype=np.uint8)
                adb_img = cv2.imdecode(image, cv2.IMREAD_COLOR)
                stageok_pos = ImgSearchADB(adb_img, 'img/stageok.png')
                if stageok_pos:
                    print(f"พบและกด stageok.png บนอุปกรณ์ {device.serial}")
                    device.shell(f"input tap {stageok_pos[0][0]} {stageok_pos[0][1]}")
                    time.sleep(1)
                continue

            # ตรวจสอบและกดปุ่ม mission ตามลำดับเท่านั้น
            misson1_pos = ImgSearchADB(adb_img, 'img/misson1.png')
            if misson1_pos:
                print(f"พบและกด misson1 บนอุปกรณ์ {device.serial}")
                device.shell(f"input tap {misson1_pos[0][0]} {misson1_pos[0][1]}")
                time.sleep(2)
                checked_stages.clear()
                continue
                
            misson2_pos = ImgSearchADB(adb_img, 'img/misson2.png')
            if misson2_pos:
                print(f"พบและกด misson2 บนอุปกรณ์ {device.serial}")
                device.shell(f"input tap {misson2_pos[0][0]} {misson2_pos[0][1]}")
                time.sleep(2)
                checked_stages.clear()
                continue

            misson3_pos = ImgSearchADB(adb_img, 'img/misson3.png')
            if misson3_pos:
                print(f"พบและกด misson3 บนอุปกรณ์ {device.serial}")
                device.shell(f"input tap {misson3_pos[0][0]} {misson3_pos[0][1]}")
                time.sleep(2)
                scroll_count = 0
                stop_scrolling = False
                checked_stages.clear()
                continue

            # ตรวจสอบ stage ต่างๆ
            if 'stage30' not in checked_stages:
                missonstage30_pos = ImgSearchADB(adb_img, 'img/missonstage30.png')
                if missonstage30_pos:
                    print(f"พบและกด missonstage30 บนอุปกรณ์ {device.serial}")
                    device.shell(f"input tap {missonstage30_pos[0][0]} {missonstage30_pos[0][1]}")
                    time.sleep(3)
                    checked_stages.add('stage30')
                    
                    stage_found = False
                    for _ in range(5):
                        cap = device.screencap()
                        image = np.frombuffer(cap, dtype=np.uint8)
                        adb_img = cv2.imdecode(image, cv2.IMREAD_COLOR)
                        stage30_pos = ImgSearchADB(adb_img, 'img/stage30.png')
                        if stage30_pos:
                            print(f"พบและกด stage30 บนอุปกรณ์ {device.serial}")
                            device.shell(f"input tap {stage30_pos[0][0]} {stage30_pos[0][1]}")
                            stage_found = True
                            time.sleep(3)
                            goto_stage_sequence(device)
                            break
                        time.sleep(2)
                    if stage_found:
                        continue

            if 'stage100' not in checked_stages:
                missonstage100_pos = ImgSearchADB(adb_img, 'img/missonstage100.png')
                if missonstage100_pos:
                    print(f"พบและกด missonstage100 บนอุปกรณ์ {device.serial}")
                    device.shell(f"input tap {missonstage100_pos[0][0]} {missonstage100_pos[0][1]}")
                    time.sleep(3)
                    checked_stages.add('stage100')
                    
                    stage_found = False
                    for _ in range(5):
                        cap = device.screencap()
                        image = np.frombuffer(cap, dtype=np.uint8)
                        adb_img = cv2.imdecode(image, cv2.IMREAD_COLOR)
                        stage100_pos = ImgSearchADB(adb_img, 'img/stage100.png')
                        if stage100_pos:
                            print(f"พบและกด stage100 บนอุปกรณ์ {device.serial}")
                            device.shell(f"input tap {stage100_pos[0][0]} {stage100_pos[0][1]}")
                            stage_found = True
                            time.sleep(3)
                            goto_stage_sequence(device)
                            break
                        time.sleep(2)
                    if stage_found:
                        continue

            if 'stage150' not in checked_stages:
                missonstage150_pos = ImgSearchADB(adb_img, 'img/missonstage150.png')
                if missonstage150_pos:
                    print(f"พบและกด missonstage150 บนอุปกรณ์ {device.serial}")
                    device.shell(f"input tap {missonstage150_pos[0][0]} {missonstage150_pos[0][1]}")
                    time.sleep(3)
                    checked_stages.add('stage150')
                    
                    device.shell(f"input swipe 114 103 811 407 500")
                    time.sleep(3)
                    
                    stage_found = False
                    for attempt in range(5):
                        cap = device.screencap()
                        image = np.frombuffer(cap, dtype=np.uint8)
                        adb_img = cv2.imdecode(image, cv2.IMREAD_COLOR)
                        stage150_pos = ImgSearchADB(adb_img, 'img/stage150.png')
                        if stage150_pos:
                            print(f"พบและกด stage150 บนอุปกรณ์ {device.serial}")
                            device.shell(f"input tap {stage150_pos[0][0]} {stage150_pos[0][1]}")
                            stage_found = True
                            time.sleep(3)
                            goto_stage_sequence(device)
                            break
                        if attempt < 4:
                            device.shell(f"input swipe 114 103 811 407 500")
                            time.sleep(3)
                    if stage_found:
                        continue

            # เช็คครบทุก stage
            if len(checked_stages) == 3:
                checked_stages.clear()
                scroll_count = 0
                time.sleep(2)
                continue

            # เลื่อนหน้าจอ
            if scroll_count < max_scrolls:
                print(f"ไม่พบรูปภาพที่ต้องการ กำลังเลื่อนหน้าจอ ครั้งที่ {scroll_count + 1} บนอุปกรณ์ {device.serial}")
                device.shell(f"input swipe 861 378 865 218 500")
                scroll_count += 1
                time.sleep(3)
            else:
                print(f"เลื่อนหน้าจอครบ {max_scrolls} ครั้งแล้ว กำลังเริ่มต้นใหม่บนอุปกรณ์ {device.serial}")
                clear_app(device)  # เคลียร์แอพ
                time.sleep(5)
                return "restart"  # ส่งสถานะ restart กลับไป
            
            time.sleep(2)
            
    except Exception as e:
        print(f"เกิดข้อผิดพลาดในการทำภารกิจ: {e}")
        return "error"

def goto_stage_sequence(device):
    """ฟังก์ชันสำหรับทำ sequence หลังจากเจอ stage"""
    # จัดกลุ่มรูปภาพตามประเภท
    image_groups = {
        'stage_free': ['stagefree1.png','stagecancel.png'],
        'stage_controls': ['stageNext.png', 'stageStart.png', 'auto.png', 'x2.png'],
        'stage_clear': [
            'stageclear1.png', 'stageclear2.png', 'stageclear3.png', 'stageclear4.png',
            'stageclear5.png', 'stageclear6.png', 'stageclear7.png', 'stageclear8.png','stageclear9.png'
        ],
        'fix_stage': ['fixstage.png', 'fixstage1.png', 'fixstage2.png', 'stageok.png'],
        'items': ['item1.png', 'item2.png', 'item3.png', 'item4.png']
    }

    while True:
        cap = device.screencap()
        image = np.frombuffer(cap, dtype=np.uint8)
        adb_img = cv2.imdecode(image, cv2.IMREAD_COLOR)
        
        found_any = False
        
        # ตรวจสอบ stageget.png เป็นพิเศษ
        stageget_pos = ImgSearchADB(adb_img, 'img/stageget.png')
        if stageget_pos:
            print(f"พบและกด stageget.png บนอุปกรณ์ {device.serial}")
            device.shell(f"input tap {stageget_pos[0][0]} {stageget_pos[0][1]}")
            time.sleep(1)
            
            # จากนั้นค่อยหา stageokk
            cap = device.screencap()
            image = np.frombuffer(cap, dtype=np.uint8)
            adb_img = cv2.imdecode(image, cv2.IMREAD_COLOR)
            stageokk_pos = ImgSearchADB(adb_img, 'img/stageokk.png')
            if stageokk_pos:
                print(f"พบและกด stageokk.png บนอุปกรณ์ {device.serial}")
                device.shell(f"input tap {stageokk_pos[0][0]} {stageokk_pos[0][1]}")
                found_any = True
                time.sleep(1)
            continue

        # ตรวจสอบแต่ละกลุ่มภาพตามปกติ
        click_positions = []
        for group_name, images in image_groups.items():
            for img_name in images:
                positions = ImgSearchADB(adb_img, f'img/{img_name}')
                if positions:
                    print(f"พบ {img_name} ในกลุ่ม {group_name} บนอุปกรณ์ {device.serial}")
                    click_positions.extend(positions)
                    found_any = True

        # คลิกทุกตำแหน่งที่พบ
        if click_positions:
            for pos in click_positions:
                print(f"กดที่ตำแหน่ง: {pos[0]}, {pos[1]} บนอุปกรณ์ {device.serial}")
                device.shell(f"input tap {pos[0]} {pos[1]}")
                time.sleep(0.5)
            time.sleep(1)

        if not found_any:
            # ตรวจสอบ backmisson และ backmisson1
            backmisson_pos = ImgSearchADB(adb_img, 'img/backmisson.png')
            if backmisson_pos:
                print(f"พบและกด backmisson บนอุปกรณ์ {device.serial}")
                device.shell(f"input tap {backmisson_pos[0][0]} {backmisson_pos[0][1]}")
                time.sleep(1)
                continue
            
            backmisson1_pos = ImgSearchADB(adb_img, 'img/backmisson1.png')
            if backmisson1_pos:
                print(f"พบและกด backmisson1 บนอุปกรณ์ {device.serial}")
                device.shell(f"input tap {backmisson1_pos[0][0]} {backmisson1_pos[0][1]}")
                time.sleep(1)
                return
        
        time.sleep(2)
  
       
       